[package]
name = "vera-core"
version = "2.8.1"
edition = "2021"
description = "Vera's library and Kobo synchronisation, without any user interface."
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
lopdf = { version = "0.38", default-features = false }
base64 = "0.22"
percent-encoding = "2"
fs4 = "0.13"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
hayro = "0.8.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "rustls-tls"] }
